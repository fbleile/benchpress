name: benchpress-notreks
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - networkx
  - scikit-learn
  - statsmodels
  - matplotlib
  - seaborn
  # Benchpress gCastle containers use Python 3.7. Snakemake injects its Python
  # package into containerized script jobs, so avoid Snakemake 9, which uses
  # Python 3.10+ syntax incompatible with those containers.
  - snakemake=7.32.4
  - pyyaml
  - r-base
  - r-essentials
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-igraph
  - r-bnlearn
  - r-pcalg
  - pip:
      - jax[cpu]
      - hyppo
      - gcastle
      - causal-learn
      - lingam
      - pgmpy
      - cdt
